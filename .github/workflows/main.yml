name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compila APK
        run: gradle assembleRelease --no-daemon
      - name: Prepara file
        run: cp app/build/outputs/apk/release/app-release.apk MotionCues.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotionCues-APK
          path: MotionCues.apk
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.${{ github.run_number }}" MotionCues.apk \
            --target "${{ github.sha }}" \
            --title "Motion Cues 2.${{ github.run_number }}" \
            --notes "Installa sopra la versione esistente." \
            --latest
