name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Estrai e compila
        run: |
          mkdir -p progetto
          unzip -o MotionCues.zip -d progetto
          cd progetto
          gradle assembleDebug --no-daemon

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionCues-APK
          path: progetto/app/build/outputs/apk/debug/app-debug.apk
